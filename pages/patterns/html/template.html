  <meta charset="UTF-8" />

  <script src="https://c.vazirweb.ir/cdn/tailwind/3.4.10/tailwind.play.min.js"></script>
  <link rel="stylesheet" href="https://c.vazirweb.ir/cdn/highlight.js/11.11.1/styles/github-dark.min.css">
  <script src="https://c.vazirweb.ir/cdn/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="../js/patterns.js" defer></script>

</head>

<script>
tailwind.config = { darkMode: "class" }
</script>

<script>
hljs.highlightAll();
</script>

<body class="cursor-none bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors">

<canvas id="cursor-canvas" class="fixed top-0 left-0 w-screen h-screen pointer-events-none z-[9999]"></canvas>

<button id="theme-toggle"
  class="fixed top-4 right-4 z-50 rounded-full border px-3 py-2
         bg-indigo-100 dark:bg-slate-800
         border-indigo-300 dark:border-indigo-700
         hover:scale-105 transition">
</button>

<script>
const btn = document.getElementById("theme-toggle");
btn.onclick = () => {
  document.documentElement.classList.toggle("dark");
  localStorage.theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
};
if (localStorage.theme === "dark") document.documentElement.classList.add("dark");

const canvas = document.getElementById("cursor-canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
let lastMove = Date.now();
let particles = [];

document.addEventListener("mousemove",(e)=>{
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  lastMove = Date.now();
  for(let i=0;i<4;i++){
    particles.push(new Particle(mouse.x,mouse.y));
  }
});

let hoveringClickable = false;
document.addEventListener("mousemove",(e)=>{
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  lastMove = Date.now();

  const style = window.getComputedStyle(e.target);
  hoveringClickable = style.cursor === "pointer";

  for(let i=0;i<4;i++){
    particles.push(new Particle(mouse.x,mouse.y));
  }
});

class Particle{
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.size=Math.random()*3+1;
    this.speedX=(Math.random()-0.5)*2;
    this.speedY=(Math.random()-0.5)*2;
    this.life=80;
    this.hue=Math.random()*360;
  }
  update(){
    this.x+=this.speedX;
    this.y+=this.speedY;
    this.life--;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.hue},100%,60%,${this.life/80})`;
    ctx.shadowColor=`hsl(${this.hue},100%,60%)`;
    ctx.shadowBlur=15;
    ctx.fill();
  }
}

function drawIdleCircles(){
  let idleTime = Date.now() - lastMove;
  if(idleTime < 200) return;
  let t = Date.now()*0.002;
  let circles = [
    {r:18, speed:1},
    {r:28, speed:-0.7},
    {r:40, speed:0.5}
  ];
  circles.forEach((c,i)=>{
    let angle = t * c.speed;
    let x = mouse.x + Math.cos(angle)*c.r;
    let y = mouse.y + Math.sin(angle)*c.r;

    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle=`hsl(${(t*80+i*90)%360},100%,65%)`;
    ctx.shadowBlur=12;
    ctx.shadowColor=ctx.fillStyle;
    ctx.fill();
  });

  ctx.beginPath();
  ctx.arc(mouse.x,mouse.y,12,0,Math.PI*2);
  ctx.strokeStyle="rgba(255,255,255,0.6)";
  ctx.lineWidth=1.5;
  ctx.stroke();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<particles.length;i++){
    particles[i].update();
    particles[i].draw();
    if(particles[i].life<=0){
      particles.splice(i,1);
      i--;
    }
  }

  drawIdleCircles();

  if (hoveringClickable) {
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 22, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "white";
    ctx.stroke();
  }

  requestAnimationFrame(animate);
}

animate();

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const codeBlock = btn.closest("section").querySelector("code");
      const text = codeBlock.innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "";
        setTimeout(() => { btn.textContent = ""; }, 1500);
      });
    });
  });
});
</script>

<header class="sticky top-0 z-40 backdrop-blur bg-white/80 dark:bg-slate-800/90 border-b">
  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-300">

            <i class="fa fa-car-side text-blue-500" aria-hidden="true"></i>
            <span class="dark:text-white"></span>
        </h3>
    </div>

    <div class="rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 shadow-lg">
      <div class="flex items-center justify-between px-4 py-2 bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
        <div class="flex gap-2">
          <span class="w-3 h-3 rounded-full bg-red-500"></span>
          <span class="w-3 h-3 rounded-full bg-yellow-500"></span>

        </div>

      </div>

<pre class="overflow-x-auto text-sm leading-relaxed bg-slate-50 dark:bg-slate-950 p-6 font-mono">
<code class="language-cpp">
</code>
</pre>
</div>
