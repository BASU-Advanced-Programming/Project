<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نقشه راه | Unmatched</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    @font-face {
      font-family: "Vazir";
      src: url("../font/Vazir.ttf");
      font-weight: 400;
      font-style: normal;
    }
    html {
      font-family: "Vazir", Tahoma, sans-serif;
      scroll-behavior: smooth;
    }
    body {
      background-color: #0f1115;
      color: #e6e6e6;
    }
    .glass-panel {
      background: rgba(17, 20, 26, 0.75);
      backdrop-filter: blur(12px);
    }
    .roadmap-section {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .roadmap-section.section-visible {
      opacity: 1;
      transform: translateY(0);
    }
    #roadmap-hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #roadmap-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 55%, #0f1115 100%);
      pointer-events: none;
      z-index: 5;
    }
    .parallax-bg {
      will-change: transform;
    }
    #roadmap-nav {
      transform: translateX(100%);
      transition: transform 0.35s ease;
    }
    #roadmap-nav.nav-open {
      transform: translateX(0);
    }
    @media (min-width: 1024px) {
      #roadmap-nav {
        transform: none;
      }
    }
    .roadmap-nav-step.nav-active span:last-child {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body class="antialiased">

  <header class="fixed top-0 inset-x-0 z-[100] bg-[#11141a]/90 border-b border-[#222] backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
      <a href="../index.html" class="text-lg font-black tracking-[0.2em] text-white hover:text-indigo-300 transition">UNMATCHED</a>
      <div class="flex items-center gap-3">
        <button
          id="theme-toggle"
          type="button"
          class="w-10 h-10 rounded-full border border-[#444] bg-[#1a1d24] text-sm hover:border-indigo-500 transition"
          aria-label="تغییر تم"
        >🌙</button>
        <button
          id="menu-toggle"
          type="button"
          class="lg:hidden w-10 h-10 rounded-lg border border-[#333] text-white text-xl"
          aria-label="منو"
        >☰</button>
      </div>
    </div>
  </header>

  <aside
    id="roadmap-nav"
    class="fixed top-[72px] bottom-0 right-0 z-[90] w-64 bg-[#11141a]/95 border-l border-[#222] backdrop-blur-xl p-5 overflow-y-auto lg:translate-x-0"
  >
    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 px-3">مسیر مطالعه</p>
    <nav id="roadmap-nav-list" class="space-y-1"></nav>
    <div class="mt-8 pt-6 border-t border-[#222] px-3 space-y-2">
      <a href="../index.html" class="text-sm text-slate-400 hover:text-white transition block">خانه</a>
      <a href="concepts/html/oop.html" class="text-sm text-slate-400 hover:text-white transition block">راهنمای C++</a>
      <a href="patterns/html/designpatterncategory.html" class="text-sm text-slate-400 hover:text-white transition block">Design Patterns</a>
    </div>
  </aside>

  <div id="nav-backdrop" class="fixed inset-0 bg-black/50 z-[85] hidden lg:hidden"></div>

  <main class="lg:mr-64">
    <div id="roadmap-hero" data-parallax-hero></div>

    <div id="section-downloads"></div>
    <div id="section-overview"></div>
    <div id="section-heroes"></div>
    <div id="section-map-cards"></div>
    <div id="section-combat"></div>
    <div id="section-delivery"></div>

    <footer class="py-12 text-center text-slate-500 text-sm border-t border-[#222]">
      Basu · Advanced Programming · Unmatched Phase 1
    </footer>
  </main>

  <script src="js/roadmap/components.js" defer></script>
  <script src="js/roadmap/parallax.js" defer></script>
  <script src="js/roadmap/app.js" defer></script>
</body>
</html>
